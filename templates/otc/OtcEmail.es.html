<!DOCTYPE html>
<html lang="es">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="x-apple-disable-message-reformatting">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>Tu código Poteau</title>
    <!--[if mso]>
    <noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript>
    <![endif]-->
    <style>
        /* Client resets. Inline styles below carry the real design -- these only
           patch clients that strip or misread the inline attributes. */
        body { margin: 0 !important; padding: 0 !important; width: 100% !important; }
        table { border-collapse: collapse !important; mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { border: 0; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic; display: block; }
        a { text-decoration: none; }

        /* Dark mode. Clients auto-invert the white card to a dark grey, which
           left the near-black code block with almost no contrast against it --
           it read as a flat slab. So dark mode gets a deliberate palette:
           a lighter card, and a code block that goes BRIGHTER than its
           surroundings rather than darker. */
        @media (prefers-color-scheme: dark) {
            .bg        { background-color: #0e1113 !important; }
            .card      { background-color: #1b1f22 !important; }
            .h1        { color: #ffffff !important; }
            .sub       { color: #b6c0c8 !important; }
            .muted     { color: #93a0a9 !important; }
            .rule      { background-color: #2e353a !important; }
            .code-cell { background-color: #ffffff !important; }
            .code-digits { color: #141414 !important; }
        }

        @media only screen and (max-width: 600px) {
            .container { width: 100% !important; }
            .pad { padding-left: 24px !important; padding-right: 24px !important; }
            .code-digits { font-size: 34px !important; letter-spacing: 8px !important; }
        }
    </style>
</head>

<!-- Page background is a soft neutral so the white card reads as a card. -->
<body style="margin:0; padding:0; background-color:#f2f4f5;">

    <!-- Preheader: shown in the inbox list next to the subject. Kept short so the
         code is visible before opening. The spacer stops clients from pulling
         body copy in after it. -->
    <div style="display:none; font-size:1px; color:#f2f4f5; line-height:1px; max-height:0; max-width:0; opacity:0; overflow:hidden;">
        Tu código de acceso: {{OTC}}
        &#8199;&#65279;&#847; &#8199;&#65279;&#847; &#8199;&#65279;&#847; &#8199;&#65279;&#847; &#8199;&#65279;&#847; &#8199;&#65279;&#847; &#8199;&#65279;&#847; &#8199;&#65279;&#847; &#8199;&#65279;&#847; &#8199;&#65279;&#847;
    </div>

    <table role="presentation" class="bg" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f2f4f5;">
        <tr>
            <td align="center" style="padding:40px 12px;">

                <!--[if mso]><table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
                <table role="presentation" class="container card" cellpadding="0" cellspacing="0" border="0"
                    style="width:100%; max-width:600px; background-color:#ffffff; border-radius:16px; overflow:hidden;">

                    <!-- Icon. Sits in its own dark tile so the app icon keeps its
                         native #141414 background instead of floating on white. -->
                    <tr>
                        <td align="center" class="pad" style="padding:48px 40px 0;">
                            <img src="https://firebasestorage.googleapis.com/v0/b/krank-club.appspot.com/o/images%2Fpoteau-icon-2026.png?alt=media&token=5ab223ce-c7ac-44c5-bbb4-0471082c8919"
                                width="64" height="64" alt="Poteau"
                                style="width:64px; height:64px; border-radius:16px; display:block;">
                        </td>
                    </tr>

                    <tr>
                        <td class="pad" style="padding:28px 40px 0;">
                            <h1 class="h1" style="margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; font-size:24px; line-height:32px; font-weight:700; color:#141414; text-align:center;">
                                Tu código de acceso
                            </h1>
                        </td>
                    </tr>

                    <tr>
                        <td class="pad" style="padding:12px 40px 0;">
                            <p class="sub" style="margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; font-size:16px; line-height:24px; color:#5c6670; text-align:center;">
                                Introdúcelo en la app para terminar tu registro.
                            </p>
                        </td>
                    </tr>

                    <!-- The code. Everything above and below exists to make this
                         easy to find and copy. -->
                    <tr>
                        <td class="pad" style="padding:32px 40px 0;">
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td class="code-cell" align="center" bgcolor="#141414" style="background-color:#141414; border-radius:12px; padding:18px 16px;">
                                        <div class="code-digits" style="font-family:'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; font-size:36px; line-height:44px; font-weight:700; color:#ffffff; letter-spacing:12px; text-indent:12px;">
                                            {{OTC}}
                                        </div>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <tr>
                        <td class="pad" style="padding:28px 40px 0;">
                            <div class="rule" style="height:1px; background-color:#e8ebed; font-size:0; line-height:0;">&nbsp;</div>
                        </td>
                    </tr>

                    <tr>
                        <td class="pad" style="padding:24px 40px 48px;">
                            <p class="muted" style="margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; font-size:14px; line-height:22px; color:#8a949e; text-align:center;">
                                ¿No has pedido este código?<br>Ignora este correo, tu cuenta está protegida.
                            </p>
                        </td>
                    </tr>

                </table>

                <table role="presentation" class="container" cellpadding="0" cellspacing="0" border="0" style="width:100%; max-width:600px;">
                    <tr>
                        <td align="center" style="padding:24px 40px 0;">
                            <p class="muted" style="margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; font-size:13px; line-height:20px; color:#98a2ab;">
                                Poteau &middot; La app para jugar al fútbol o pádel
                            </p>
                        </td>
                    </tr>
                </table>
                <!--[if mso]></td></tr></table><![endif]-->

            </td>
        </tr>
    </table>

</body>

</html>
