<!DOCTYPE html>
<html lang="{{language}}">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <style>
        body {
            font-family: 'Sora', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Helvetica Neue', sans-serif;
            font-weight: 400;
            margin: 0;
            padding: 0;
            background-color: #034903;
            min-height: 100vh;
            width: 100%;
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            box-sizing: border-box;
            overflow-x: hidden;
            font-size: 0.9em;
            line-height: 1.5;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border: 0;
            border-spacing: 0;
            font-family: 'Sora', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        td {
            padding: 0;
            vertical-align: top;
            box-sizing: border-box;
        }

        /* PADDING SYSTEM. The card had three overlapping sources of spacing --
           20px table padding, a 50px/30px/20px .container margin, and per-element
           padding on top of both -- so no edge matched any other and the top was
           visibly tighter than the bottom. All of it now comes from .container:
           one value for the sides, one for top and bottom. */
        table.inner {
            max-width: 500px;
            width: 100%;
            background-color: #FFF;
            margin: 60px auto;
            box-sizing: border-box;
            padding: 0;
            box-shadow: 0 0 30px 20px #00000034;
        }

        h1 {
            padding: 0;
            font-weight: 900;
            color: #131313;
            text-align: left;
            font-size: 1.4em;
            /* line-height 1.2 with a negative top margin cancels the half-leading
               the font adds above the cap height, so the measured gap above the
               title matches the 36px on the sides instead of reading as 43px. */
            line-height: 1.2;
            margin: -6px 0 12px;
        }

        p {
            color: #131313;
            margin: 0;
            text-align: left;
        }

        .text {
            width: 100%;
        }

        .message {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            justify-content: space-between;
            align-items: flex-start;
            align-content: center;
        }

        #picture {
            padding: 0;
            text-align: center;
            margin: 0 auto;
            width: 100%;
        }

        #picture img {
            width: 100px;
            border-radius: 15px;
            margin: 0 auto;
            display: block;
        }

        .button {
            background: #0036D6;
            padding: 10px 20px;
            color: #fff;
            margin: 25px 0px;
            font-weight: 600;
            border-radius: 5px;
            display: inline-block;
        }

        a {
            text-decoration: none;
            text-align: left;
            color: white;
        }

        /* Icon + sign-off are one block at the foot of the card: the icon sits
           directly above "L'équipe Poteau", both centred. 40px because it closes
           the email rather than opening it -- at 56px the dark tile pulled the
           eye away from the message. The image carries its own padding (the P
           fills 52% of the tile), so it reads as a mark and not a slab. */
        /* The gap that used to sit above .footer lives here now, because the
           icon is the first thing in the sign-off block. */
        #logo {
            padding: 40px 0 0;
        }

        #logo img {
            margin: 0 auto 12px;
            width: 40px;
            display: block;
            border-radius: 10px;
        }

        .footer {
            padding: 0;
            text-align: center;
            /* Was bold black, which made it read as a heading for whatever came
               after it. It is a sign-off; the other templates render it at
               #8a949e, not 600 weight. */
            font-weight: 400;
            font-size: 0.9em;
            color: #8a949e;
        }

        .container {
            /* The only source of padding inside the card. Equal on all four
               sides; the sign-off block adds its own gap above itself. */
            padding: 36px;
            margin: 0;
            box-sizing: border-box;
        }

        .unsub {
            margin: 70px auto;
            width: 100%;
            text-align: center;
            font-size: 0.9em;
            display: block;
        }

        .unsub a {
            color: #8ea58e;
            text-align: center;
            margin: 0 auto;
            display: block;
        }
    </style>
    <!-- Fallback: Some clients support @import in a style block -->
    <style type="text/css">
        @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400..700&display=swap');
    </style>

    <!-- Primary method -->
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400..700&display=swap" rel="stylesheet">
</head>

<body>
    <table role="presentation">
        <tbody>
            <tr>
                <td>
                    <table class="inner">
                        <tbody>
                            <tr>
                                <td>
                                    <div class="container">
                                        {{#if picture}}
                                        <div id="picture">
                                            <img src="{{picture}}" alt="User Picture">
                                        </div>
                                        {{/if}}
                                        <h1>{{{heading_text}}}</h1>
                                        <!-- No trailing arrow. It was appended to
                                             every body regardless of whether the
                                             CTA was worth pointing at, and the
                                             newer templates (InvitationEmail, OTC)
                                             do not use one. -->
                                        <p>{{{main_body_text}}}</p>
                                        <a href="{{cta_link_url}}">
                                            <div class="button">
                                                <strong>
                                                    {{{cta_link_text}}}
                                                </strong>
                                            </div>
                                        </a>
                                        <div id="logo">
                                            <img src="https://firebasestorage.googleapis.com/v0/b/krank-club.appspot.com/o/images%2Fpoteau-icon-2026-email.png?alt=media&token=f9ba6856-4bcb-43ab-8aaa-3fa5339b64fe"
                                                width="40" height="40" alt="Poteau"
                                                style="width:40px;height:40px;border-radius:10px;display:block;margin:0 auto 12px;">
                                        </div>
                                        <p class="footer">{{{footer_text}}}</p>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <!-- Omitted entirely for transactional mail to a user who
                         already unsubscribed: an <a> with no href is a dead link,
                         and re-offering unsubscribe to someone who used it reads
                         as broken. sendFallbackEmail sends unsubscribe_url="" in
                         that case; the explanation goes in footer_text instead. -->
                    {{#if unsubscribe_url}}
                    <p class="unsub">
                        <a href="{{unsubscribe_url}}">{{{unsubscribe_text}}}</a>
                    </p>
                    {{/if}}
                </td>
            </tr>
        </tbody>
    </table>
</body>

</html>
