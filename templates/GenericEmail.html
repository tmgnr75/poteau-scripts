<!DOCTYPE html>
<html lang="{{language}}">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <style>
        body {
            font-family: 'Sora', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Helvetica Neue', sans-serif;
            font-weight: 400;
            margin: 0;
            padding: 0;
            background-color: #034903;
            min-height: 100vh;
            width: 100%;
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            box-sizing: border-box;
            overflow-x: hidden;
            font-size: 0.9em;
            line-height: 1.5;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border: 0;
            border-spacing: 0;
            font-family: 'Sora', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        td {
            padding: 0;
            vertical-align: top;
            box-sizing: border-box;
        }

        table.inner {
            max-width: 500px;
            width: 100%;
            background-color: #FFF;
            margin: 60px auto;
            box-sizing: border-box;
            padding: 20px 0;
            box-shadow: 0 0 30px 20px #00000034;
        }

        h1 {
            padding: 20px 0 0;
            font-weight: 900;
            color: #131313;
            text-align: left;
            font-size: 1.4em;
            margin: 15px auto;
        }

        p {
            color: #131313;
            margin: 0;
            text-align: left;
        }

        .text {
            width: 100%;
        }

        .message {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            justify-content: space-between;
            align-items: flex-start;
            align-content: center;
        }

        #picture {
            padding: 0;
            text-align: center;
            margin: 0 auto;
            width: 100%;
        }

        #picture img {
            width: 100px;
            border-radius: 15px;
            margin: 0 auto;
            display: block;
        }

        .button {
            background: #0036D6;
            padding: 10px 20px;
            color: #fff;
            margin: 25px 0px;
            font-weight: 600;
            border-radius: 5px;
            display: inline-block;
        }

        a {
            text-decoration: none;
            text-align: left;
            color: white;
        }

        #logo img {
            margin: 0 auto 50px;
            width: 70px;
            display: block;
        }

        .footer {
            padding: 70px 0 0;
            text-align: center;
            font-weight: 600;
            font-size: 0.9em;
        }

        .container {
            margin: 50px 30px 20px;
            box-sizing: border-box;
        }

        .unsub {
            margin: 70px auto;
            width: 100%;
            text-align: center;
            font-size: 0.9em;
            display: block;
        }

        .unsub a {
            color: #8ea58e;
            text-align: center;
            margin: 0 auto;
            display: block;
        }
    </style>
    <!-- Fallback: Some clients support @import in a style block -->
    <style type="text/css">
        @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400..700&display=swap');
    </style>

    <!-- Primary method -->
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400..700&display=swap" rel="stylesheet">
</head>

<body>
    <table role="presentation">
        <tbody>
            <tr>
                <td>
                    <table class="inner">
                        <tbody>
                            <tr>
                                <td>
                                    <div class="container">
                                        {{#if picture}}
                                        <div id="picture">
                                            <img src="{{picture}}" alt="User Picture">
                                        </div>
                                        {{/if}}
                                        <h1>{{{heading_text}}}</h1>
                                        <p>{{{main_body_text}}} ⤵️</p>
                                        <a href="{{cta_link_url}}">
                                            <div class="button">
                                                <strong>
                                                    {{{cta_link_text}}}
                                                </strong>
                                            </div>
                                        </a>
                                        <p class="footer">{{{footer_text}}}</p>
                                    </div>
                                    <div id="logo">
                                        <img src="https://firebasestorage.googleapis.com/v0/b/krank-club.appspot.com/o/images%2Fpoteau-circle.png?alt=media&token=1413a238-0640-472b-bbb6-50c8c53a3ba9"
                                            alt="Logo, vintage ball">
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <!-- Omitted entirely for transactional mail to a user who
                         already unsubscribed: an <a> with no href is a dead link,
                         and re-offering unsubscribe to someone who used it reads
                         as broken. sendFallbackEmail sends unsubscribe_url="" in
                         that case; the explanation goes in footer_text instead. -->
                    {{#if unsubscribe_url}}
                    <p class="unsub">
                        <a href="{{unsubscribe_url}}">{{{unsubscribe_text}}}</a>
                    </p>
                    {{/if}}
                </td>
            </tr>
        </tbody>
    </table>
</body>

</html>
